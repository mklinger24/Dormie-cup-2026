?'<div class="hst h"><small>match over</small></div>':q.w?`<div class="hst ${q.diff>0?'r':q.diff<0?'b':'h'}">${q.diff?Math.abs(q.diff)+'UP':'AS'}<small>${q.w==='H'?'hole tied':q.w==='R'?'Red won':'Black won'}</small></div>`:'<div class="hst h">·</div>';h+=`<div class="hole ${q.locked?'locked':''}"><div class="hno">${q.h}</div><div class="choices">${q.locked?'':choice(q.h,'R',q.w,'RED','red')+choice(q.h,'H',q.w,'TIE','tie')+choice(q.h,'B',q.w,'BLACK','black')}</div>${st}</div>`});h+='</section>'});h+='<p class="note">Tap RED, TIE, or BLACK for each hole. Tap the selected result again to clear it. Results save automatically and update live for everyone.</p>';app.innerHTML=h}async function setResult(h,w){let id=S.view.id,sc=S.scores[id]||(S.scores[id]={red:{},black:{}}),cur=winner(sc,h);if(cur===w)w=null;delete sc.red[h];delete sc.black[h];if(w==='R')sc.red[h]=1;if(w==='B')sc.black[h]=1;if(w==='H'){sc.red[h]=1;sc.black[h]=1}render();let{error}=await db.from('hole_scores').update({red_score:sc.red[h]||0,black_score:sc.black[h]||0,updated_at:new Date().toISOString()}).eq('match_id',id).eq('hole_number',h);if(error)toast('Could not save result')}app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open){S.view={name:'match',id:+b.dataset.open};render();scrollTo(0,0)}else if(b.dataset.back){S.view={name:'board'};render();scrollTo(0,0)}else if(b.dataset.win)setResult(+b.dataset.hole,b.dataset.win)});function timeFmt(v){return new Date(v).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function renderChat(){if(!CHAT.name){chatPanel.innerHTML=`<div class="chathead"><strong>💬 Dormie Cup Chat</strong><button class="chatclose" data-chatclose>×</button></div><div class="namebox"><h3>Join the chat</h3><p>Enter the name everyone will see when you post.</p><input id="nameInput" maxlength="30" placeholder="Your name"><button id="saveName">ENTER CHAT</button></div>`;return}let counts={};CHAT.reacts.forEach(r=>{let k=r.message_id+'|'+r.emoji;counts[k]=(counts[k]||0)+1});let msgs=CHAT.msgs.length?CHAT.msgs.map(m=>{let rs=['😂','🔥','👀','🏆','🍺'].map(e=>{let n=counts[m.id+'|'+e]||0;return `<button class="react ${n?'has':''}" data-react="${e}" data-mid="${m.id}">${e}${n?' '+n:''}</button>`}).join('');return `<div class="msg"><div class="msgmeta"><b>${esc(m.name)}</b><span>${timeFmt(m.created_at)}</span></div><div class="msgtext">${esc(m.message)}</div><div class="reacts">${rs}</div></div>`}).join(''):'<div class="chatempty">No messages yet.<br>Start the Dormie Cup trash talk.</div>';chatPanel.innerHTML=`<div class="chathead"><strong>💬 Dormie Cup Chat</strong><button class="chatclose" data-chatclose>×</button></div><div class="chatname">Posting as <b>${esc(CHAT.name)}</b> <button data-changename>change</button></div><div class="chatmsgs" id="chatMsgs">${msgs}</div><div class="quick"><button data-quick="😂">😂</button><button data-quick="🔥">🔥</button><button data-quick="👀">👀</button><button data-quick="🏆">🏆</button><button data-quick="🍺">🍺</button></div><form class="chatcompose" id="chatForm"><input id="chatInput" maxlength="500" autocomplete="off" placeholder="Message the group…"><button>SEND</button></form>`;requestAnimationFrame(()=>{let e=document.getElementById('chatMsgs');if(e)e.scrollTop=e.scrollHeight})}function openChat(){CHAT.open=true;CHAT.unread=0;unread.classList.remove('on');chatShade.classList.add('on');renderChat()}function closeChat(){CHAT.open=false;chatShade.classList.remove('on')}chatBtn.onclick=openChat;chatShade.addEventListener('click',e=>{if(e.target===chatShade||e.target.closest('[data-chatclose]'))closeChat();let save=e.target.closest('#saveName');if(save){let v=document.getElementById('nameInput').value.trim();if(!v)return;CHAT.name=v.slice(0,30);localStorage.setItem('dormie_chat_name',CHAT.name);renderChat()}if(e.target.closest('[data-changename]')){CHAT.name='';localStorage.removeItem('dormie_chat_name');renderChat()}let q=e.target.closest('[data-quick]');if(q){let input=document.getElementById('chatInput');input.value=(input.value+' '+q.dataset.quick).trim();input.focus()}let r=e.target.closest('[data-react]');if(r)addReaction(+r.dataset.mid,r.dataset.react)});chatShade.addEventListener('submit',async e=>{if(e.target.id!=='chatForm')return;e.preventDefault();let input=document.getElementById('chatInput'),message=input.value.trim();if(!message||!CHAT.name)return;input.value='';let{error}=await db.from('chat_messages').insert({name:CHAT.name,message});if(error){toast('Chat message did not send');input.value=message}});async function addReaction(mid,emoji){let{error}=await db.from('chat_reactions').insert({message_id:mid,emoji});if(error)toast('Reaction did not send')}async function bootChat(){let[{data:m,error:me},{data:r,error:re}]=await Promise.all([db.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(50),db.from('chat_reactions').select('*').order('created_at',{ascending:true})]);if(!me)CHAT.msgs=(m||[]).reverse();if(!re)CHAT.reacts=r||[];db.channel('dormie-chat-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{if(!CHAT.msgs.some(x=>x.id===p.new.id))CHAT.msgs.push(p.new);if(CHAT.msgs.length>50)CHAT.msgs.shift();if(CHAT.open)renderChat();else{CHAT.unread++;unread.textContent=CHAT.unread;unread.classList.add('on')}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_reactions'},p=>{if(!CHAT.reacts.some(x=>x.id===p.new.id))CHAT.reacts.push(p.new);if(CHAT.open)renderChat()}).subscribe()}async function boot(){try{let{data,error}=await db.from('hole_scores').select('*');if(error)throw error;C.matches.forEach(m=>S.scores[m.id]={red:{},black:{}});data.forEach(q=>{if(q.red_score>0)S.scores[q.match_id].red[q.hole_number]=q.red_score;if(q.black_score>0)S.scores[q.match_id].black[q.hole_number]=q.black_score});modeTxt.textContent='● LIVE';render();db.channel('dormie-live-v4').on('postgres_changes',{event:'UPDATE',schema:'public',table:'hole_scores'},p=>{let q=p.new,sc=S.scores[q.match_id];q.red_score>0?sc.red[q.hole_number]=q.red_score:delete sc.red[q.hole_number];q.black_score>0?sc.black[q.hole_number]=q.black_score:delete sc.black[q.hole_number];render()}).subscribe();bootChat()}catch(e){modeTxt.textContent='Connection error';toast(e.message)}}render();boot();</script></body></html>
