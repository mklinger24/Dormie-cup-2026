<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dormie Cup 2026 — Live</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07110d;color:#f7f2e7;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1c15;border-bottom:1px solid #314238;padding:16px}.wrap{max-width:1050px;margin:auto}.eyebrow{color:#c9a962;font-size:12px;letter-spacing:2px;font-weight:800}.title{font-family:Georgia,serif;font-size:30px;margin:3px 0}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;margin-top:12px}.team{text-align:center;font-weight:800}.red{color:#ff7777}.black{color:#ddd}.big{font-family:Georgia,serif;font-size:34px}.cup{text-align:center;color:#c9a962;font-size:12px}.status{font-size:12px;color:#aab8b0;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:18px 0}.card{background:#10231a;border:1px solid #314238;border-radius:14px;overflow:hidden}.cardhead{padding:14px;border-bottom:1px solid #314238}.matchno{font-size:11px;color:#c9a962;font-weight:800;letter-spacing:1px}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-weight:700}.players div:last-child{text-align:right}.segment{padding:12px 14px;border-bottom:1px solid #26372f}.seghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.format{font-size:12px;color:#aab8b0}.result{font-size:12px;font-weight:800}.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.hole{text-align:center}.hn{font-size:10px;color:#8fa097}.btns{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px}.scorebtn{border:1px solid #46584e;background:#0a1711;color:#eee;border-radius:6px;padding:7px 2px;font-weight:800}.scorebtn.winred{background:#8d2d31}.scorebtn.winblack{background:#222}.scorebtn:active{transform:scale(.95)}.legend{padding:10px 14px;font-size:11px;color:#8fa097}.error{background:#56252a;padding:10px;border-radius:8px;margin-top:10px}.live{color:#73d99d}.footer{text-align:center;color:#6f8077;font-size:11px;padding:20px}.projected{font-size:12px;color:#aab8b0;text-align:center;margin-top:3px}@media(max-width:600px){.title{font-size:25px}.big{font-size:29px}.wrap{padding-left:10px;padding-right:10px}.grid{grid-template-columns:1fr}.holes{gap:3px}.scorebtn{padding:9px 1px}}</style></head><body><header><div class="wrap"><div class="eyebrow">LIVE SCORING</div><div class="title">DORMIE CUP 2026</div><div class="scoreboard"><div class="team red">TEAM RED<div class="big" id="redTotal">0</div></div><div class="cup">CUP SCORE<div class="projected" id="projected">Projected 0 — 0</div></div><div class="team black">TEAM BLACK<div class="big" id="blackTotal">0</div></div></div><div class="status" id="status">Connecting…</div><div id="err"></div></div></header><main class="wrap"><div class="grid" id="grid"></div><div class="footer">Tap RED or BLACK for the team that won the hole. Tap the selected team again to return the hole to a tie.</div></main><script>
const URL='https://cjmbckeznnboruzemgva.supabase.co';
const KEY='sb_publishable_jobVmpi-pv15ySoFXaiUpA_srXh2t7B';
const db=supabase.createClient(URL,KEY);
let matches=[],scores=[];
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function calc(matchId,start){let lead=0,played=0;for(let h=start;h<start+6;h++){const s=scores.find(x=>x.match_id===matchId&&x.hole_number===h);if(!s)continue;if(s.red_score!==0||s.black_score!==0)played++;if(s.red_score>s.black_score)lead++;if(s.black_score>s.red_score)lead--;}const remaining=6-played;let done=Math.abs(lead)>remaining||played===6;let ptsR=0,ptsB=0;if(done){if(lead>0)ptsR=1;else if(lead<0)ptsB=1;else{ptsR=.5;ptsB=.5}}let label='AS';if(lead>0)label=lead+' UP';if(lead<0)label=Math.abs(lead)+' UP';if(done){if(lead===0)label='HALVED';else if(remaining>0)label=Math.abs(lead)+'&'+remaining;else label=Math.abs(lead)+' UP'}else if(remaining>0&&Math.abs(lead)===remaining&&lead!==0)label='DORMIE · '+Math.abs(lead)+' UP';return{lead,played,remaining,done,ptsR,ptsB,label}}
function totals(project=false){let r=0,b=0;for(const m of matches)for(const st of [1,7,13]){const x=calc(m.id,st);if(x.done){r+=x.ptsR;b+=x.ptsB}else if(project){if(x.lead>0)r++;else if(x.lead<0)b++;else{r+=.5;b+=.5}}}return[r,b]}
function render(){const [r,b]=totals(false),[pr,pb]=totals(true);redTotal.textContent=r;blackTotal.textContent=b;projected.textContent=`Projected ${pr} — ${pb}`;grid.innerHTML=matches.map(m=>`<section class="card"><div class="cardhead"><div class="matchno">MATCH ${m.match_number}${m.tee_time?' · '+esc(m.tee_time):''}</div><div class="players"><div class="red">${esc(m.red_player_1)||'Team Red'}${m.red_player_2?'<br>'+esc(m.red_player_2):''}</div><div class="black">${esc(m.black_player_1)||'Team Black'}${m.black_player_2?'<br>'+esc(m.black_player_2):''}</div></div></div>${segment(m,1,m.segment_1_format||'Best Ball')}${segment(m,7,m.segment_2_format||'Alternate Shot')}${segment(m,13,m.segment_3_format||'Best Ball')}<div class="legend">Scores update live for everyone viewing this page.</div></section>`).join('')}
function segment(m,start,fmt){const x=calc(m.id,start);let side=x.lead>0?'red':x.lead<0?'black':'';return `<div class="segment"><div class="seghead"><div><b>Holes ${start}–${start+5}</b><div class="format">${esc(fmt)}</div></div><div class="result ${side}">${x.label}</div></div><div class="holes">${Array.from({length:6},(_,i)=>hole(m.id,start+i)).join('')}</div></div>`}
function hole(mid,h){const s=scores.find(x=>x.match_id===mid&&x.hole_number===h)||{red_score:0,black_score:0};return `<div class="hole"><div class="hn">${h}</div><div class="btns"><button class="scorebtn ${s.red_score>s.black_score?'winred':''}" onclick="setHole(${mid},${h},'red')">R</button><button class="scorebtn ${s.black_score>s.red_score?'winblack':''}" onclick="setHole(${mid},${h},'black')">B</button></div></div>`}
async function setHole(mid,h,team){const s=scores.find(x=>x.match_id===mid&&x.hole_number===h);if(!s)return;let red=team==='red'?1:0,black=team==='black'?1:0;if((team==='red'&&s.red_score>s.black_score)||(team==='black'&&s.black_score>s.red_score)){red=0;black=0}s.red_score=red;s.black_score=black;render();const {error}=await db.from('hole_scores').update({red_score:red,black_score:black,updated_at:new Date().toISOString()}).eq('match_id',mid).eq('hole_number',h);if(error)showErr(error.message)}
function showErr(t){err.innerHTML=`<div class="error">${esc(t)}</div>`}
async function load(){const [m,s]=await Promise.all([db.from('matches').select('*').order('match_number'),db.from('hole_scores').select('*').order('match_id').order('hole_number')]);if(m.error||s.error){showErr((m.error||s.error).message);status.textContent='Connection problem';return}matches=m.data;scores=s.data;status.innerHTML='<span class="live">● LIVE</span> · Anyone with this link can enter scores';render();db.channel('dormie-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'hole_scores'},p=>{const i=scores.findIndex(x=>x.id===p.new.id);if(i>=0)scores[i]=p.new;render()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'matches'},()=>location.reload()).subscribe()}
load();
</script></body></html>
