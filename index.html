<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dormie Cup 2026 — Live</title><style>*{box-sizing:border-box}body{margin:0;background:#07110d;color:#f7f2e7;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 12px}header{background:#0b1c15;border-bottom:1px solid #314238;padding:18px 0}.eyebrow{color:#c9a962;font-size:12px;letter-spacing:2px;font-weight:800}.title{font:30px Georgia,serif}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin-top:14px}.red{color:#ff7777}.black{color:#ddd}.big{font:34px Georgia,serif}.cup{color:#c9a962;font-size:12px}.status{margin-top:10px;font-size:12px;color:#aab8b0}.live{color:#73d99d}.error{background:#56252a;padding:10px;border-radius:8px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;padding:18px 0}.card{background:#10231a;border:1px solid #314238;border-radius:14px;overflow:hidden}.cardhead,.segment{padding:14px;border-bottom:1px solid #314238}.matchno{font-size:11px;color:#c9a962;font-weight:bold}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-weight:bold}.players div:last-child{text-align:right}.seghead{display:flex;justify-content:space-between;margin-bottom:8px}.format{font-size:11px;color:#91a199}.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.hole{text-align:center}.hn{font-size:10px;color:#91a199}.btns{display:grid;grid-template-columns:1fr 1fr;gap:2px}.scorebtn{padding:8px 1px;border:1px solid #46584e;border-radius:5px;background:#0a1711;color:white;font-weight:bold}.winred{background:#8d2d31}.winblack{background:#333}.footer{text-align:center;color:#788980;font-size:11px;padding:20px}</style></head><body><header><div class="wrap"><div class="eyebrow">LIVE SCORING</div><div class="title">DORMIE CUP 2026</div><div class="scoreboard"><div class="red"><b>TEAM RED</b><div class="big" id="redTotal">0</div></div><div class="cup">CUP SCORE<div id="projected">Projected 0 — 0</div></div><div class="black"><b>TEAM BLACK</b><div class="big" id="blackTotal">0</div></div></div><div class="status" id="status">Starting app…</div><div id="err"></div></div></header><main class="wrap"><div class="grid" id="grid"></div><div class="footer">Tap R or B for the team that won each hole. Tap the selected team again to return the hole to a tie.</div></main><script type="module">
const URL='https://cjmbckeznnboruzemgva.supabase.co';const KEY='sb_publishable_jobVmpi-pv15ySoFXaiUpA_srXh2t7B';
const statusEl=document.getElementById('status'),errEl=document.getElementById('err'),grid=document.getElementById('grid');let matches=[],scores=[],db;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(t){statusEl.textContent='Connection problem';errEl.innerHTML='<div class="error">'+esc(t)+'</div>'}
function calc(mid,start){let lead=0,played=0;for(let h=start;h<start+6;h++){let s=scores.find(x=>x.match_id===mid&&x.hole_number===h);if(!s)continue;if(s.red_score||s.black_score)played++;if(s.red_score>s.black_score)lead++;if(s.black_score>s.red_score)lead--}let rem=6-played,done=Math.abs(lead)>rem||played===6,r=0,b=0;if(done){lead>0?r=1:lead<0?b=1:(r=b=.5)}let label=lead?Math.abs(lead)+' UP':'AS';if(done)label=lead===0?'HALVED':rem?Math.abs(lead)+'&'+rem:Math.abs(lead)+' UP';else if(rem&&Math.abs(lead)===rem&&lead)label='DORMIE · '+Math.abs(lead)+' UP';return{lead,done,r,b,label}}
function totals(project){let r=0,b=0;for(const m of matches)for(const st of [1,7,13]){let x=calc(m.id,st);if(x.done){r+=x.r;b+=x.b}else if(project){x.lead>0?r++:x.lead<0?b++:(r+=.5,b+=.5)}}return[r,b]}
function hole(mid,h){let s=scores.find(x=>x.match_id===mid&&x.hole_number===h)||{red_score:0,black_score:0};return `<div class="hole"><div class="hn">${h}</div><div class="btns"><button class="scorebtn ${s.red_score>s.black_score?'winred':''}" data-mid="${mid}" data-hole="${h}" data-team="red">R</button><button class="scorebtn ${s.black_score>s.red_score?'winblack':''}" data-mid="${mid}" data-hole="${h}" data-team="black">B</button></div></div>`}
function segment(m,start,fmt){let x=calc(m.id,start);return `<div class="segment"><div class="seghead"><div><b>Holes ${start}–${start+5}</b><div class="format">${esc(fmt)}</div></div><b class="${x.lead>0?'red':x.lead<0?'black':''}">${x.label}</b></div><div class="holes">${Array.from({length:6},(_,i)=>hole(m.id,start+i)).join('')}</div></div>`}
function render(){let [r,b]=totals(false),[pr,pb]=totals(true);document.getElementById('redTotal').textContent=r;document.getElementById('blackTotal').textContent=b;document.getElementById('projected').textContent=`Projected ${pr} — ${pb}`;grid.innerHTML=matches.map(m=>`<section class="card"><div class="cardhead"><div class="matchno">MATCH ${m.match_number}${m.tee_time?' · '+esc(m.tee_time):''}</div><div class="players"><div class="red">${esc(m.red_player_1)||'Team Red'}${m.red_player_2?'<br>'+esc(m.red_player_2):''}</div><div class="black">${esc(m.black_player_1)||'Team Black'}${m.black_player_2?'<br>'+esc(m.black_player_2):''}</div></div></div>${segment(m,1,m.segment_1_format||'Best Ball')}${segment(m,7,m.segment_2_format||'Alternate Shot')}${segment(m,13,m.segment_3_format||'Best Ball')}</section>`).join('')}
async function setHole(mid,h,team){let s=scores.find(x=>x.match_id===mid&&x.hole_number===h);if(!s)return;let red=team==='red'?1:0,black=team==='black'?1:0;if((team==='red'&&s.red_score>s.black_score)||(team==='black'&&s.black_score>s.red_score))red=black=0;let old=[s.red_score,s.black_score];s.red_score=red;s.black_score=black;render();let {error:e}=await db.from('hole_scores').update({red_score:red,black_score:black,updated_at:new Date().toISOString()}).eq('match_id',mid).eq('hole_number',h);if(e){s.red_score=old[0];s.black_score=old[1];render();error(e.message)}}
grid.addEventListener('click',e=>{let b=e.target.closest('button[data-mid]');if(b)setHole(Number(b.dataset.mid),Number(b.dataset.hole),b.dataset.team)});
async function start(){try{statusEl.textContent='Loading scoring system…';const mod=await import('https://esm.sh/@supabase/supabase-js@2');db=mod.createClient(URL,KEY);statusEl.textContent='Loading matches…';const [mr,sr]=await Promise.all([db.from('matches').select('*').order('match_number'),db.from('hole_scores').select('*').order('match_id').order('hole_number')]);if(mr.error)throw mr.error;if(sr.error)throw sr.error;matches=mr.data||[];scores=sr.data||[];if(!matches.length)throw new Error('Connected to Supabase, but no matches were found in the matches table.');statusEl.innerHTML='<span class="live">● LIVE</span> · '+matches.length+' matches loaded · Anyone with this link can enter scores';render();db.channel('dormie-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'hole_scores'},p=>{let i=scores.findIndex(x=>x.id===p.new.id);if(i>=0)scores[i]=p.new;render()}).subscribe()}catch(e){console.error(e);error(e?.message||String(e))}}
start();
</script></body></html>
