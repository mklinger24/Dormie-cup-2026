ight:1.05}.chip .sub{font-size:11px;color:var(--muted)}.chip.rl{background:var(--redt);box-shadow:inset 3px 0 var(--red)}.chip.rl .val{color:var(--red)}.chip.bl{background:var(--blkt);box-shadow:inset 3px 0 var(--blk)}.chip.rw{background:var(--red);color:#fff}.chip.bw{background:var(--blk);color:#fff}.chip.rw .lab,.chip.rw .sub,.chip.bw .lab,.chip.bw .sub{color:#fff}.back{background:none;border:0;color:#dfeee5;padding:10px 0;font-weight:700;font-size:15px}.card,.seg{background:var(--plate);border-radius:6px;margin-top:10px}.card{padding:14px}.cupmini{text-align:center;border-bottom:1px solid var(--rule);padding:0 0 10px;margin-bottom:10px}.cupmini .label{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}.cupmini .scoreline{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;margin-top:2px}.cupmini .r{color:var(--red)}.cupmini .b{color:var(--blk)}.vsline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.vsline .rp,.vsline .bp{font-family:var(--display);font-size:22px;font-weight:700}.vsline .tot{font-size:34px}.seg{overflow:hidden;margin-top:14px}.seghead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--plate2);border-bottom:1px solid var(--rule)}.seghead h3{margin:0;font-family:var(--display);font-size:20px}.seghead h3 span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}.badge{font-family:var(--display);font-weight:700;font-size:16px;padding:3px 10px;border-radius:3px;background:#dfe2da}.badge.r{background:var(--red);color:#fff}.badge.b{background:var(--blk);color:#fff}.badge.rl{background:var(--redt);color:var(--red)}.badge.bl{background:var(--blkt)}.hole{display:grid;grid-template-columns:42px 1fr 70px;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid #eceee8}.hole.locked{opacity:.5}.hno{font-family:var(--display);font-weight:700;font-size:21px;text-align:center}.choices{display:grid;grid-template-columns:1fr .8fr 1fr;gap:6px}.choice{border:1.5px solid var(--rule);background:#fff;border-radius:6px;padding:10px 4px;font-family:var(--display);font-weight:700;font-size:15px}.choice.red{color:var(--red)}.choice.black{color:var(--blk)}.choice.tie{color:#666}.choice.sel.red{background:var(--red);color:#fff;border-color:var(--red)}.choice.sel.black{background:var(--blk);color:#fff;border-color:var(--blk)}.choice.sel.tie{background:var(--gold);color:#1c1f1d;border-color:var(--gold)}.hst{text-align:center;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.05}.hst.r{color:var(--red)}.hst.b{color:var(--blk)}.hst.h{color:var(--muted)}.hst small{display:block;font-family:var(--body);font-weight:500;font-size:10px;color:var(--muted)}.note{color:#b9d4c3;font-size:13px;margin:10px 2px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:4px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}@media(max-width:420px){.team .pts{font-size:66px}.hole{grid-template-columns:32px 1fr 56px;gap:5px;padding-left:6px;padding-right:6px}.choice{padding:10px 2px;font-size:14px}.vsline .rp,.vsline .bp{font-size:18px}.vsline .tot{font-size:28px}.matchlead .counts{gap:8px;font-size:15px}}</style></head><body><header class="top"><div class="wrap"><div class="brand"><h1 id="title">Dormie Cup 2026</h1><p id="sub">Tiffany Greens Golf Club</p></div><div class="pill" id="modeTxt">Connecting…</div></div></header><main class="wrap" id="app"></main><div class="toast" id="toast"></div><script type="module">const URL='https://cjmbckeznnboruzemgva.supabase.co',KEY='sb_publishable_jobVmpi-pv15ySoFXaiUpA_srXh2t7B';const{createClient}=await import('https://esm.sh/@supabase/supabase-js@2');const db=createClient(URL,KEY);const C={title:'Dormie Cup 2026',course:'Tiffany Greens Golf Club',date:'Saturday, October 10',matches:[{id:1,tee:'11:00 AM',red:['Brian Bondurant','Shane Nemechek'],black:['Tyler Metzger','Josh Masrud'],formats:['Scramble','Scramble','Scramble']},{id:2,tee:'11:09 AM',red:['Ryan Sloop','Jason Hoffman'],black:['Jim Hammen','Mark Hernandez'],formats:['Scramble','Mod Alt Shot','Best Ball']},{id:3,tee:'11:18 AM',red:['Ryley Haas','Brent Fry'],black:['Brian Dick','Colin Davis'],formats:['Scramble','Mod Alt Shot','Best Ball']},{id:4,tee:'11:27 AM',red:['Jeremy Zimney','Will Allen'],black:['Jason McCandless','Van Ryan Belanger'],formats:['Scramble','Mod Alt Shot','Best Ball']},{id:5,tee:'11:36 AM',red:['Andrew Madl','Alex Ward'],black:['David Dunn','Chris Brown'],formats:['Scramble','Mod Alt Shot','Best Ball']},{id:6,tee:'11:45 AM',red:['Austin Osborn','Matt Klinger'],black:['Ryan Pidhaichuk','JW Roeder'],formats:['Scramble','Mod Alt Shot','Best Ball']},{id:7,tee:'11:54 AM',red:['Tommy Slaughter','Andrew Firkins'],black:['Jared Dunn','Zach Renn'],formats:['Scramble','Mod Alt Shot','Best Ball']}]};let S={scores:{},view:{name:'board'}};const pts=n=>{let w=Math.floor(n+1e-9),h=Math.abs(n-w-.5)<1e-9;return w===0&&h?'½':w+(h?'½':'')};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}function winner(sc,h){let r=sc?.red?.[h]||0,b=sc?.black?.[h]||0;if(r===1&&b===0)return'R';if(r===0&&b===1)return'B';if(r===1&&b===1)return'H';return null}function segment(sc,k){let start=k*6+1,diff=0,played=0,last=0,result=null,holes=[];for(let h=start;h<start+6;h++){let w=winner(sc,h),x={h,w,locked:!!result};if(w&&!result){played++;last=h;if(w==='R')diff++;if(w==='B')diff--;let rem=6-played;x.diff=diff;if(Math.abs(diff)>rem){result={red:diff>0?1:0,text:Math.abs(diff)+'&'+rem,win:diff>0?'R':'B'}}else if(!rem){result={red:diff>0?1:diff<0?0:.5,text:diff===0?'Halved':Math.abs(diff)+'UP',win:diff>0?'R':diff<0?'B':'H'}}}holes.push(x)}let rem=6-played;return{start,end:start+5,diff,played,rem,thru:last,result,holes,dormie:!result&&played>0&&Math.abs(diff)===rem&&rem>0}}function ms(m){let segs=[0,1,2].map(k=>segment(S.scores[m.id],k)),red=0,black=0,pr=0,pb=0,decided=0;segs.forEach(s=>{if(s.result){red+=s.result.red;black+=1-s.result.red;pr+=s.result.red;pb+=1-s.result.red;decided++}else if(s.played){let v=s.diff>0?1:s.diff<0?0:.5;pr+=v;pb+=1-v}});return{segs,red,black,pr,pb,decided}}function totals(){let t={red:0,black:0,pr:0,pb:0,decided:0};C.matches.forEach(m=>{let x=ms(m);t.red+=x.red;t.black+=x.black;t.pr+=x.pr;t.pb+=x.pb;t.decided+=x.decided});return t}function matchLeaders(){let r=0,b=0,tie=0;C.matches.forEach(m=>{let x=ms(m),rv=x.red,bv=x.black;x.segs.forEach(s=>{if(!s.result&&s.played){if(s.diff>0)rv+=1;else if(s.diff<0)bv+=1;else{rv+=.5;bv+=.5}}});if(rv>bv)r++;else if(bv>rv)b++;else tie++});return{r,b,tie}}function lab(s){if(s.result)return s.result.win==='H'?{c:'',v:'½',sub:'Halved'}:{c:s.result.win==='R'?'rw':'bw',v:s.result.text,sub:(s.result.win==='R'?'Red':'Black')+' +1'};if(!s.played)return{c:'',v:'—',sub:'Not started'};if(!s.diff)return{c:'',v:'AS',sub:'thru '+s.thru};return{c:s.diff>0?'rl':'bl',v:(s.dormie?'Dormie ':'')+Math.abs(s.diff)+'UP',sub:(s.diff>0?'Red ':'Black ')+'thru '+s.thru}}function render(){title.textContent=C.title;sub.textContent=C.course+', '+C.date;S.view.name==='match'?renderMatch(S.view.id):renderBoard()}function renderBoard(){let t=totals(),ml=matchLeaders(),status=t.decided===0?'First tee at 11:00 AM.':t.red===t.black?'All square, '+pts(21-t.decided)+' to play':'Team '+(t.red>t.black?'Red':'Black')+' leads by '+pts(Math.abs(t.red-t.black))+', '+pts(21-t.decided)+' to play';let h=`<section class="score"><div class="team red"><div class="name">Team Red</div><div class="pts">${pts(t.red)}</div><div class="proj">${t.pr+t.pb>t.red+t.black?'Projected '+pts(t.pr):''}</div></div><div class="vs">vs</div><div class="team black"><div class="name">Team Black</div><div class="pts">${pts(t.black)}</div><div class="proj">${t.pr+t.pb>t.red+t.black?'Projected '+pts(t.pb):''}</div></div></section><div class="status">${status}</div><div style="text-align:center;margin:4px 0 14px;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.35"><div style="color:#fff">BLACK TEAM — 10½ POINTS TO RETAIN</div><div style="color:#ff8b9d">RED TEAM — 11 POINTS TO WIN</div></div><div class="bar"><div class="r" style="width:${t.red/21*100}%"></div><div class="b" style="width:${t.black/21*100}%"></div><div class="mid"></div></div><div class="barlbl"><span>Red: 11 to win</span><span>Black: 10½ to retain</span></div><div class="matchlead"><div class="label">CURRENT MATCHES</div><div class="counts"><span class="red">RED LEADING ${ml.r}</span><span>•</span><span class="tie">TIED ${ml.tie}</span><span>•</span><span class="black">BLACK LEADING ${ml.b}</span></div></div><div class="sect">Matches<small>Tap a match to enter results</small></div>`;C.matches.forEach((m,i)=>{let x=ms(m);h+=`<button class="match" data-open="${m.id}"><div class="mhead"><span><b>Match ${i+1}</b>, ${m.tee}</span><span>${x.decided} of 3 decided</span></div><div class="players"><div class="rp">${m.red.join('<br>')}</div><div class="tot"><span style="color:var(--red)">${pts(x.red)}</span> – ${pts(x.black)}</div><div class="bp">${m.black.join('<br>')}</div></div><div class="chips">`;x.segs.forEach(s=>{let l=lab(s);h+=`<div class="chip ${l.c}"><div class="lab">Holes ${s.start}–${s.end}</div><div class="val">${l.v}</div><div class="sub">${l.sub}</div></div>`});h+='</div></button>'});h+='<p class="note">Each 6-hole match is worth 1 point; a halved match is ½ each.</p>';app.innerHTML=h}function choice(h,w,current,label,cls){return `<button class="choice ${cls} ${current===w?'sel':''}" data-hole="${h}" data-win="${w}">${label}</button>`}function renderMatch(id){let i=C.matches.findIndex(m=>m.id===id),m=C.matches[i],x=ms(m),t=totals();let h=`<button class="back" data-back="1">‹ ALL MATCHES</button><div class="card"><div class="mhead"><span><b>Match ${i+1}</b>, ${m.tee}</span><span>Tap the hole result</span></div><div class="cupmini"><div class="label">DORMIE CUP — LIVE</div><div class="scoreline"><span class="r">RED ${pts(t.red)}</span> &nbsp;—&nbsp; <span class="b">${pts(t.black)} BLACK</span></div></div><div class="vsline"><div class="rp">${m.red.join('<br>')}</div><div class="tot"><span style="color:var(--red)">${pts(x.red)}</span> – ${pts(x.black)}</div><div class="bp">${m.black.join('<br>')}</div></div></div>`;x.segs.forEach((s,k)=>{let badge=s.result?(s.result.win==='H'?'<span class="badge">Halved, ½ each</span>':`<span class="badge ${s.result.win==='R'?'r':'b'}">${s.result.win==='R'?'Red':'Black'} wins ${s.result.text}</span>`):!s.played?'<span class="badge">Not started</span>':!s.diff?'<span class="badge">All square</span>':`<span class="badge ${s.diff>0?'rl':'bl'}">${s.diff>0?'Red ':'Black '}${s.dormie?'dormie ':''}${Math.abs(s.diff)}UP</span>`;h+=`<section class="seg"><div class="seghead"><h3>Holes ${s.start}–${s.end}<span>${m.formats[k]}</span></h3>${badge}</div>`;s.holes.forEach(q=>{let st=q.locked?'<div class="hst h"><small>match over</small></div>':q.w?`<div class="hst ${q.diff>0?'r':q.diff<0?'b':'h'}">${q.diff?Math.abs(q.diff)+'UP':'AS'}<small>${q.w==='H'?'hole tied':q.w==='R'?'Red won':'Black won'}</small></div>`:'<div class="hst h">·</div>';h+=`<div class="hole ${q.locked?'locked':''}"><div class="hno">${q.h}</div><div class="choices">${q.locked?'':choice(q.h,'R',q.w,'RED','red')+choice(q.h,'H',q.w,'TIE','tie')+choice(q.h,'B',q.w,'BLACK','black')}</div>${st}</div>`});h+='</section>'});h+='<p class="note">Tap RED, TIE, or BLACK for each hole. Tap the selected result again to clear it. Results save automatically and update live for everyone.</p>';app.innerHTML=h}async function setResult(h,w){let id=S.view.id,sc=S.scores[id]||(S.scores[id]={red:{},black:{}}),cur=winner(sc,h);if(cur===w)w=null;delete sc.red[h];delete sc.black[h];if(w==='R')sc.red[h]=1;if(w==='B')sc.black[h]=1;if(w==='H'){sc.red[h]=1;sc.black[h]=1}render();let{error}=await db.from('hole_scores').update({red_score:sc.red[h]||0,black_score:sc.black[h]||0,updated_at:new Date().toISOString()}).eq('match_id',id).eq('hole_number',h);if(error)toast('Could not save result')}app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open){S.view={name:'match',id:+b.dataset.open};render();scrollTo(0,0)}else if(b.dataset.back){S.view={name:'board'};render();scrollTo(0,0)}else if(b.dataset.win)setResult(+b.dataset.hole,b.dataset.win)});async function boot(){try{let{data,error}=await db.from('hole_scores').select('*');if(error)throw error;C.matches.forEach(m=>S.scores[m.id]={red:{},black:{}});data.forEach(q=>{if(q.red_score>0)S.scores[q.match_id].red[q.hole_number]=q.red_score;if(q.black_score>0)S.scores[q.match_id].black[q.hole_number]=q.black_score});modeTxt.textContent='● Live';render();db.channel('dormie-live-v3').on('postgres_changes',{event:'UPDATE',schema:'public',table:'hole_scores'},p=>{let q=p.new,sc=S.scores[q.match_id];q.red_score>0?sc.red[q.hole_number]=q.red_score:delete sc.red[q.hole_number];q.black_score>0?sc.black[q.hole_number]=q.black_score:delete sc.black[q.hole_number];render()}).subscribe()}catch(e){modeTxt.textContent='Connection error';toast(e.message)}}render();boot();</script></body></html>
